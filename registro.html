<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nébula - Regístrate</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

<header class="principal">
    <img src="./imgs/cover.jpg" alt="Cober Nébula, a series of albums on outer space">
    <h1>Tu música en la nube y en tu espacio.</h1>
</header>

<main>
    <h2>Regístrate</h2>
    <form action="http://localhost:8080/api/registro" method="get">
        <div>
            <label for="txt_nombre">Nombre:</label>
            <input id="txt_nombre" name="nombre" type="text" minlength="3" required placeholder="Escriba su nombre completo">
        </div>

        <div>
            <label for="txt_correo">E-Mail</label>
            <input id="txt_correo" type="email" required placeholder="correo@mail.com" name="correo">
        </div>

        <div>
            <label for="txt_contrasenia">Contraseña:</label>
            <input id="txt_contrasenia" name="contrasenia" type="password" required placeholder="Escriba su contraseña">
        </div>

        <div>
            <label for="txt_pseudonimo">Pseudónimo:</label>
            <input id="txt_pseudonimo" name="txt_pseudonimo" type="text" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}" required placeholder="ej. Nova-42">
        </div>

        <div>
            <label for="txt_dob">Fecha de nacimiento:</label>
            <input id="txt_dob" type="date" required name="fechaNacimiento">
        </div>

        <label for="genero-container">Género</label>
        <div id="genero-container">
            <label for="radio-masculino">Masculino</label>
            <input type="radio" value="masculino" id="radio-masculino" name="rad_genero">

            <label for="radio-femenino">Femenino</label>
            <input type="radio" value="femenino" id="radio-femenino" name="rad_genero">

            <label for="radio-otro">Otro</label>
            <input type="radio" value="otro" id="radio-otro" name="rad_genero">
        </div>

        <div>
            <label for="sel_suscripcion">Elige tu suscripción</label>
            <select id="sel_suscripcion" name="sel_suscripcion">
                <option value="gratis">Gratis</option>
                <option value="mensual">Mensual</option>
                <option value="anual">Anual</option>
            </select>
        </div>

        <div>
            <label for="txt_comentarios">Comentarios:</label>
            <textarea id="txt_comentarios" name="comentarios" placeholder="Escribe un comentario"></textarea>
        </div>

        <div class="terms">
            <label for="chk_terminos">Acepto los términos y condiciones</label>
            <input name="chk_terminos" id="chk_terminos" type="checkbox">
        </div>

        <div class="options">
            <button type="submit">Registrar</button>
            <button type="reset">Restablecer</button>
        </div>

    </form>
</main>

</body>
</html>
